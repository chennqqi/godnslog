components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Token from login
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key for programmatic access

  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: Error code (400, 401, 403, 404, 500, 502)
          enum: [400, 401, 403, 404, 500, 502]
        message:
          type: string
          description: Error message
        data:
          type: object
          description: Optional error details

    SuccessResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: Success code (0 for success)
          example: 0
          enum: [0]
        message:
          type: string
          description: Success message
          example: OK
        data:
          type: object
          description: Response data (optional)

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Username or email
        password:
          type: string
          format: password
          description: User password

    LoginResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          description: Response code (0 for success)
          example: 0
        message:
          type: string
          description: Response message
          example: OK
        data:
          type: object
          required:
            - token
            - user
          properties:
            token:
              type: string
              description: JWT access token
            user:
              $ref: '#/components/schemas/User'

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: JWT refresh token

    CaseCreateRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: Case title
        description:
          type: string
          description: Case description
        target:
          type: string
          description: Target system or domain
        tags:
          type: array
          items:
            type: string
          description: Case tags

    CaseUpdateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        target:
          type: string
        status:
          type: string
          enum: [active, archived, completed]
        tags:
          type: array
          items:
            type: string

    Case:
      type: object
      required:
        - id
        - title
        - created_by
        - created_at
      properties:
        id:
          type: string
          description: Case ID
        title:
          type: string
          description: Case title
        description:
          type: string
          description: Case description
        target:
          type: string
          description: Target system or domain
        status:
          type: string
          enum: [active, archived, completed]
          description: Case status
        tags:
          type: array
          items:
            type: string
        created_by:
          type: string
          description: User ID who created the case
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CaseResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: OK
        data:
          $ref: '#/components/schemas/Case'

    CaseListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: OK
        data:
          type: object
          required:
            - items
            - total
            - page
            - page_size
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Case'
            total:
              type: integer
            page:
              type: integer
            page_size:
              type: integer

    PayloadCreateRequest:
      type: object
      required:
        - case_id
        - template_id
      properties:
        case_id:
          type: string
          description: Associated case ID
        template_id:
          type: string
          description: Payload template ID (SSRF, XXE, RCE, etc.)
        variables:
          type: object
          additionalProperties:
            type: string
          description: Custom variables for template rendering
        expires_at:
          type: string
          format: date-time
          description: Payload expiration time

    Payload:
      type: object
      required:
        - id
        - case_id
        - token
        - template_id
        - template_rendered
        - status
        - created_at
      properties:
        id:
          type: string
          description: Payload ID
        case_id:
          type: string
          description: Associated case ID
        token:
          type: string
          description: Unique token for interaction correlation
        template_id:
          type: string
          description: Template ID used for generation
        template_rendered:
          type: string
          description: Rendered payload with variables substituted
        variables:
          type: object
          additionalProperties:
            type: string
          description: Variable values used in rendering
        status:
          type: string
          enum: [active, expired, revoked]
          description: Payload status
        expires_at:
          type: string
          format: date-time
          description: Expiration timestamp
        created_at:
          type: string
          format: date-time
          description: Creation timestamp

    PayloadResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: OK
        data:
          $ref: '#/components/schemas/Payload'

    PayloadListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: OK
        data:
          type: object
          required:
            - items
            - total
            - page
            - page_size
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Payload'
            total:
              type: integer
            page:
              type: integer
            page_size:
              type: integer

    Interaction:
      type: object
      required:
        - id
        - type
        - timestamp
        - source_ip
      properties:
        id:
          type: string
          description: Interaction ID
        type:
          type: string
          enum: [dns, http, smtp, ldap, smb, ftp]
        case_id:
          type: string
        payload_id:
          type: string
        token:
          type: string
        timestamp:
          type: string
          format: date-time
        source_ip:
          type: string
        # DNS specific
        domain:
          type: string
        dns_type:
          type: string
        # HTTP specific
        method:
          type: string
        path:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: string
        user_agent:
          type: string
        content_type:
          type: string
        # Common
        raw_data:
          type: string
          description: Raw interaction data

    InteractionResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: OK
        data:
          $ref: '#/components/schemas/Interaction'

    InteractionListResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: OK
        data:
          type: object
          required:
            - items
            - total
            - page
            - page_size
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Interaction'
            total:
              type: integer
            page:
              type: integer
            page_size:
              type: integer

    DeleteRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: string
          description: List of IDs to delete

    ExportRequest:
      type: object
      required:
        - format
      properties:
        format:
          type: string
          enum: [json, markdown, csv]
        case_id:
          type: string
        payload_id:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        include_raw:
          type: boolean
          default: false

    EvidenceResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: OK
        data:
          type: object
          properties:
            format:
              type: string
            content:
              type: string
            metadata:
              type: object

    ApiKeyCreateRequest:
      type: object
      required:
        - name
        - scopes
      properties:
        name:
          type: string
          description: API key name
        scopes:
          type: array
          items:
            type: string
          description: API key scopes
        is_agent:
          type: boolean
          description: Mark as agent-specific key
          default: false
        workspace_id:
          type: string
          description: Workspace constraint (optional)
        risk_tolerance:
          type: string
          enum: [low, medium, high]
          description: Risk level tolerance
        expires_at:
          type: string
          format: date-time
          description: Expiration time

    ApiKey:
      type: object
      required:
        - id
        - key_prefix
        - name
        - scopes
        - created_by
        - created_at
      properties:
        id:
          type: string
          description: API key ID
        key:
          type: string
          description: API key value (only shown on creation)
        key_prefix:
          type: string
          description: API key prefix for identification
        name:
          type: string
          description: API key name
        scopes:
          type: array
          items:
            type: string
          description: API key scopes
        workspace_id:
          type: string
          description: Workspace constraint (optional)
        risk_tolerance:
          type: string
          enum: [low, medium, high]
          description: Risk level tolerance
        is_agent:
          type: boolean
          description: Agent API key flag
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        is_revoked:
          type: boolean

    ApiKeyResponse:
      type: object
      required:
        - code
        - message
        - data
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
