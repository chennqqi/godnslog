  listener.ListenerConfig:
    properties:
      allow_private_ips:
        description: |-
          AllowPrivateIPs allows connections from RFC 1918 private IP ranges.
          Default false — private IP connections are rejected.
        type: boolean
      buffer_size:
        type: integer
      enable_tls:
        type: boolean
      max_concurrent_connections:
        description: |-
          MaxConcurrentConnections is the max simultaneous connections across all IPs.
          0 means use MaxConnections as fallback.
        type: integer
      max_connections:
        type: integer
      rate_limit_max:
        description: |-
          RateLimitMax is the max connections per IP within the rate limit window.
          0 means use MaxConnections as fallback. Default is high to avoid false negatives.
        type: integer
      timeout:
        $ref: '#/definitions/time.Duration'
      tls_cert_file:
        type: string
      tls_key_file:
        type: string
      whitelist_cidrs:
        description: |-
          WhitelistCIDRs is a list of CIDR ranges that bypass rate and connection limits.
          e.g. ["10.0.0.0/8", "192.168.0.0/16"]
