info:
  contact: {}
paths:
  /admin/user:
    delete:
      consumes:
      - application/json
      description: delete user by id
      parameters:
      - description: User IDs to delete
        in: body
        name: ids
        required: true
        schema:
          items:
            type: integer
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.CR'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/server.CR'
      summary: delUser
    put:
      consumes:
      - application/json
      description: add a new User
      parameters:
      - description: User data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.UserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.CR'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/server.CR'
        "502":
          description: BadService
          schema:
            $ref: '#/definitions/server.CR'
      summary: addUser
  /admin/user/list:
    get:
      consumes:
      - application/json
      description: get Dns Record by user query
      parameters:
      - description: Some ID
        in: path
        name: some_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            type: string
        "400":
          description: We need ID!!
          schema:
            $ref: '#/definitions/server.CR'
        "401":
          description: Can not find ID
          schema:
            $ref: '#/definitions/server.CR'
        "404":
          description: Can not find ID
          schema:
            $ref: '#/definitions/server.CR'
      summary: userInfo
  /api/v2/attack-chains:
    get:
      consumes:
      - application/json
      description: List all attack chains grouped by token with pagination
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (1-100, default 20)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: list of attack chains
          schema:
            $ref: '#/definitions/gin.H'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/gin.H'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/gin.H'
      summary: List attack chains
      tags:
      - v2
      - attack-chains
  /api/v2/attack-chains/{token}:
    get:
