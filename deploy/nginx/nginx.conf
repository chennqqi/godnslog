worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream godnslog_api {
        least_conn;
        server godnslog-1:8080 max_fails=3 fail_timeout=30s;
        server godnslog-2:8080 max_fails=3 fail_timeout=30s;
    }

    upstream godnslog_frontend {
        least_conn;
        server godnslog-1:3000 max_fails=3 fail_timeout=30s;
        server godnslog-2:3000 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8080;
        server_name _;

        location /api/ {
            proxy_pass http://godnslog_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://godnslog_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 3000;
        server_name _;

        location / {
            proxy_pass http://godnslog_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
