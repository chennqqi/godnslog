# GODNSLOG Nginx Reverse Proxy Configuration
#
# This configuration template demonstrates how to run GODNSLOG behind an Nginx
# reverse proxy. In this mode, GODNSLOG listens on a high port (e.g. 18080)
# and Nginx handles TLS termination and port 80/443 binding.
#
# Usage:
#   1. Copy this file to your Nginx conf.d directory
#   2. Replace OAST_DOMAIN with your actual domain
#   3. Replace BACKEND_HOST with your GODNSLOG backend address
#   4. Configure TLS certificates (Let's Encrypt or your own)
#   5. Reload Nginx

# Upstream definition for GODNSLOG backend
upstream godnslog_backend {
    least_conn;
    # Replace with your GODNSLOG backend address
    # For Docker: godnslog:18080
    # For local: 127.0.0.1:18080
    # For Unix socket: unix:/var/run/godnslog.sock
    server 127.0.0.1:18080 max_fails=3 fail_timeout=30s;
    # Add more backends for HA:
    # server godnslog-2:18080 max_fails=3 fail_timeout=30s;
}

# HTTP server: redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name OAST_DOMAIN;

    # ACME challenge location (if using certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server: main GODNSLOG reverse proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name OAST_DOMAIN;

    # TLS certificates (replace with your paths)
    # For Let's Encrypt with certbot:
    ssl_certificate /etc/letsencrypt/live/OAST_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/OAST_DOMAIN/privkey.pem;

    # TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # WebSocket support (for real-time interaction push)
    location /api/ws {
        proxy_pass http://godnslog_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API and web interface
    location / {
        proxy_pass http://godnslog_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support WebSocket upgrade for other endpoints
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
