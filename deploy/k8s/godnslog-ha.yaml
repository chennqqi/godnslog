apiVersion: v1
kind: ConfigMap
metadata:
  name: godnslog-config
  namespace: godnslog
data:
  DOMAIN: "example.com"
  DNS_IP: "0.0.0.0"
  REDIS_URL: "redis:6379"

---
apiVersion: v1
kind: Secret
metadata:
  name: godnslog-secret
  namespace: godnslog
type: Opaque
stringData:
  # Change these values for production deployment
  ADMIN_PASSWORD: "changeme"

---
apiVersion: v1
kind: Service
metadata:
  name: godnslog
  namespace: godnslog
spec:
  type: ClusterIP
  selector:
    app: godnslog
  ports:
    - name: api
      port: 8080
      targetPort: 8080
    - name: frontend
      port: 3000
      targetPort: 3000
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: godnslog
  namespace: godnslog
  labels:
    app: godnslog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: godnslog
  template:
    metadata:
      labels:
        app: godnslog
    spec:
      containers:
        - name: godnslog
          image: godnslog:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: api
            - containerPort: 3000
              name: frontend
            - containerPort: 53
              name: dns-udp
              protocol: UDP
            - containerPort: 53
              name: dns-tcp
              protocol: TCP
          envFrom:
            - configMapRef:
                name: godnslog-config
            - secretRef:
                name: godnslog-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v2/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v2/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 30

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: godnslog
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: godnslog
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: godnslog
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: godnslog-lb
  namespace: godnslog
spec:
  type: LoadBalancer
  selector:
    app: godnslog
  ports:
    - name: api
      port: 8080
      targetPort: 8080
    - name: frontend
      port: 3000
      targetPort: 3000
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: godnslog-hpa
  namespace: godnslog
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: godnslog
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
